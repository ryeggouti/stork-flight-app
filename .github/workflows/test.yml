name: Service worker tests

on:
  push:
    paths:
      - sw.js
      - tests/sw.test.cjs
      - .github/workflows/test.yml
  pull_request:
    paths:
      - sw.js
      - tests/sw.test.cjs
      - .github/workflows/test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/sw.test.cjs
