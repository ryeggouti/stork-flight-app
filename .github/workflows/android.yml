# Builds the Android app (APK) with the game files packed inside it.
# Run it from the Actions tab: "Build Android app" -> "Run workflow".
# Needs two repository secrets: KEYSTORE_BASE64 and KEYSTORE_PASSWORD.
name: Build Android app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor and the fonts
        run: npm install --no-audit --no-fund

      - name: Copy the game into the app
        run: node prepare.js

      - name: Create the Android project
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          npx cap add android
          bash native.sh

      - name: Build the APK
        working-directory: app-build/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign the APK with your key
        working-directory: app-build/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/signing.keystore" --ks-key-alias my-key-alias \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "$GITHUB_WORKSPACE/Stork_Flight.apk" "$RUNNER_TEMP/aligned.apk"
          rm "$RUNNER_TEMP/signing.keystore"
          "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/Stork_Flight.apk" | grep SHA-256

      - uses: actions/upload-artifact@v4
        with:
          name: Stork_Flight-apk
          path: Stork_Flight.apk
